<div class="workspace">
  <button *ngIf="menuOpen" class="sidebar-backdrop" type="button" aria-label="Close navigation" (click)="menuOpen = false"></button>
  <aside class="sidebar" [class.sidebar-open]="menuOpen" aria-label="Workspace navigation">
    <a class="brand" routerLink="/dashboard" (click)="menuOpen = false"><img class="brand-mark" src="assets/etm-mark.svg" alt=""><span>ETM<small>Employee & Task Manager</small></span></a>
    <nav class="workspace-nav"><span class="nav-caption">WORKSPACE</span><a routerLink="/dashboard" routerLinkActive="active" (click)="menuOpen = false"><app-icon name="dashboard"></app-icon>Dashboard</a><a *ngIf="auth.session?.role === 'ADMIN'" routerLink="/users" routerLinkActive="active" (click)="menuOpen = false"><app-icon name="users"></app-icon>Users</a><a routerLink="/tasks" routerLinkActive="active" (click)="menuOpen = false"><app-icon name="tasks"></app-icon>{{ auth.session?.role === 'EMPLOYEE' ? 'My tasks' : 'Tasks' }}</a><a *ngIf="auth.session?.role !== 'EMPLOYEE'" routerLink="/reports" routerLinkActive="active" (click)="menuOpen = false"><app-icon name="reports"></app-icon>Reports</a></nav>
    <div class="sidebar-bottom"><div class="profile"><span class="avatar">{{ initials }}</span><div><strong>{{ auth.session?.name }}</strong><small>{{ roleName }}</small></div></div><button type="button" class="logout-button" (click)="auth.logout()"><app-icon name="logout"></app-icon>Logout</button></div>
  </aside>
  <div class="workspace-body"><header class="topbar"><div class="breadcrumb-line"><button type="button" class="mobile-menu" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation"><app-icon name="menu"></app-icon></button><span>Workspace</span><span class="breadcrumb-separator">/</span><strong>{{ pageName }}</strong></div><div class="account-menu-container"><button #accountButton type="button" class="account-button" (click)="accountOpen = !accountOpen" [attr.aria-expanded]="accountOpen" aria-controls="account-panel" aria-label="Account options"><span class="account-button-label">{{ roleName }}</span><span class="avatar avatar-small" aria-hidden="true">{{ initials }}</span><app-icon class="account-chevron" name="chevron"></app-icon></button><div id="account-panel" class="account-panel" *ngIf="accountOpen"><strong>{{ auth.session?.name }}</strong><span>{{ roleName }}</span><button type="button" (click)="auth.logout()"><app-icon name="logout"></app-icon>Logout</button></div></div></header><main id="main-content" class="workspace-content"><router-outlet></router-outlet></main></div>
</div>
