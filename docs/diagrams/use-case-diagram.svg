<text x="300" y="995.64" fill="#52657b" font-family="Arial, sans-serif" font-size="17" font-weight="400">Login validates email/password; protected actions require a valid JWT and active account.</text>
<text x="40" y="1069.32" fill="#142b49" font-family="Arial, sans-serif" font-size="21" font-weight="700">Scope notes</text>
<text x="40" y="1103.64" fill="#52657b" font-family="Arial, sans-serif" font-size="17" font-weight="400">ADMIN views all tasks. MANAGER task list/dashboard include only tasks originally assigned by that manager.</text>
<text x="40" y="1130.64" fill="#52657b" font-family="Arial, sans-serif" font-size="17" font-weight="400">MANAGER PDF includes tasks of current team employees, including ADMIN-assigned tasks; report access does not grant edit rights.</text>
<text x="40" y="1157.64" fill="#52657b" font-family="Arial, sans-serif" font-size="17" font-weight="400">EMPLOYEE cannot access reports or change another employee&#x27;s task. User deletion is soft deletion (active=false).</text>
